name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall exécute `prisma generate` (aucune base de données nécessaire)
      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Clés i18n (fr/en/ar identiques)
        run: npm run i18n:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci
